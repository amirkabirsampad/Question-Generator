<!DOCTYPE html>
<html lang="fa" dir="rtl"><head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آزمون تولید شده</title>
    <link href="test%20print_files/css2.css" rel="stylesheet">
    <style>
        @page {
            size: A4;
            margin: 15mm;
            @bottom-center {
                content: "صفحه " counter(page);
                font-size: 12px;
            }
        }
        body {
            font-family: 'Vazirmatn', sans-serif;
            direction: rtl;
            margin: 10px;
            line-height: 1.4;
            font-size: 14px;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
            font-size: 20px;
            font-weight: bold;
        }
        .info-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        .info-table td {
            border: 2px solid black;
            padding: 6px;
            text-align: right;
        }
        .exam-title {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            margin: 15px 0;
            border-bottom: 2px solid black;
        }
        .questions-table {
            width: 100%;
            border-collapse: collapse;
        }
        .questions-table th, .questions-table td {
            border: 1px solid black;
            padding: 4px;
            text-align: right;
            vertical-align: top;
        }
        .questions-table th {
            background-color: #f0f0f0;
            font-weight: bold;
        }
        .question-number {
            width: 40px;
            text-align: center;
        }
        .question-text {
            text-align: right;
        }
        @media print {
            body {
                margin: 0;
                font-size: 14px;
            }
            .questions-table {
                page-break-inside: auto;
                border-collapse: separate;
                border-spacing: 0;
            }
            .info-table {
                page-break-inside: auto;
                
                border-spacing: 0;
            }
            .questions-table tr {
                page-break-inside: avoid;
            }
            .questions-table th, .questions-table td {
                
            }
            .questions-table th {
                background-color: #f0f0f0;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            thead {
                display: table-header-group;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        بسم الله الرحمن الرحیم
    </div>
    
    <table class="info-table">
        <tbody><tr>
            <td>نام و نام خانوادگی: &nbsp;</td>
            <td>نام درس: dsfg</td>
            <td>فصل: 23</td>
        </tr>
        <tr>
            <td>پایه: None</td>
            <td>نام معلم: dfgdsfg</td>
            <td>نام مدرسه: sdf</td>
        </tr>
    </tbody></table>
    
    <table class="questions-table">
        <thead>
            <tr>
                <th class="question-number">شماره</th>
                <th class="question-text">سوال</th>
            </tr>
        </thead>
        <tbody>

        <tr>
            <td class="question-number">1</td>
            <td class="question-text">(سوال کوتاه)<br><br><br></td>
        </tr>

        <tr>
            <td class="question-number">2</td>
            <td class="question-text">(سوال)<br><br><br><br><br><br></td>
        </tr>

        <tr>
            <td class="question-number">3</td>
            <td class="question-text">(سوال درست یا نادرست)<br>الف) غلط<br>ب) درست</td>
        </tr>

        <tr>
            <td class="question-number">4</td>
            <td class="question-text">سوال بدون عنوان<br>الف) (گزینه 1)<br>ب) (گزینه 2)<br>ج) (گزینه 3)<br>د) (گزینه 4)</td>
        </tr>

        </tbody>
    </table>


</body></html>
